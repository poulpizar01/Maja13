<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Membres — {{espace}} · {{nom}}</title>
<meta name="application-name" content="{{nom}}">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="espace.css">
<script src="espace.js"></script>
</head>
<body class="espace-body">

<script>espaceShell()</script>

<main class="espace-page">
  <div class="section__head">
    <span class="numeral">✦</span>
    <h2>Membres</h2>
    <p class="sub">Ceux qui portent les couleurs</p>
  </div>
  <div class="espace-loading" id="loading">Chargement…</div>
  <div class="membres-outils" id="outils" hidden>
    <input class="admin-input membres-cherche" id="q" type="search" placeholder="Nom RP, pseudo Discord ou grade…" aria-label="Rechercher un membre">
    <p class="membres-compte" id="compte"></p>
  </div>
  <div class="membres-grid" id="grid"></div>
  <p class="admin-empty" id="aucun" hidden>Personne ne correspond à cette recherche.</p>
</main>

<script>
  const $ = id => document.getElementById(id);
  fetch('../api/me', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(m => { if (m) espaceNav(m); });
  fetch('../api/membres', { credentials: 'same-origin' })
    .then(r => { if (r.status === 401) { location.replace('./'); throw 0; } if (r.status === 403) { location.replace('attente.html'); throw 0; } return r.json(); })
    .then(list => {
      $('loading').hidden = true; $('outils').hidden = false;
      $('grid').innerHTML = list.map(m => `
        <article class="miembro" data-featured="${m.rankFeatured}" data-cherche="${espaceEsc(norm(`${m.displayName} ${m.username} ${m.rankLabel || ''}`))}">
          <img src="${m.avatarUrl || '../assets/favicon.png'}" alt="" width="72" height="72">
          <span class="rank__title">${espaceEsc(m.rankLabel || 'Sans grade')}</span>
          <span class="miembro__name">${espaceEsc(m.displayName)}</span>
          <span class="miembro__user">@${espaceEsc(m.username)}</span>
        </article>`).join('');
      // recherche : champ de la page, pré-rempli par la palette (?q=)
      $('q').value = new URLSearchParams(location.search).get('q') || '';
      filtre();
    }).catch(() => {});
  const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  function filtre() {
    const q = norm($('q').value.trim()), cartes = [...$('grid').children];
    let n = 0;
    cartes.forEach(c => { const ok = !q || c.dataset.cherche.includes(q); c.hidden = !ok; n += ok; });
    $('compte').textContent = q ? `${n} sur ${cartes.length}` : `${cartes.length} membre${cartes.length > 1 ? 's' : ''}`;
    $('aucun').hidden = n > 0;
  }
  $('q').addEventListener('input', filtre);
  $('logout').addEventListener('click', async () => { await fetch('../auth/logout', { method: 'POST', credentials: 'same-origin' }); location.href = './'; });
</script>
</body>
</html>
