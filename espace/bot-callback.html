<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion au bot — {{espace}} · {{nom}}</title>
<meta name="application-name" content="{{nom}}">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="espace.css">
</head>
<body class="espace-body">

<!-- Retour de la connexion au bot Discord : son API renvoie ici (site externe du serveur Discord,
     /config site-externe set …/espace/bot-callback.html) avec le jeton en #token=… -->
<main class="espace-login">
  <img class="espace-login__logo" src="../assets/logo.png" alt="{{nom}}" width="200" height="200">
  <p class="eyebrow">Bot Discord de {{groupe}}</p>
  <h1>Connexion</h1>
  <p class="espace-login__lead" id="lead">Connexion au bot en cours…</p>
  <a class="btn btn--accent espace-login__btn" id="back" href="profil.html" hidden>Retour au profil</a>
</main>

<script>
  const token = new URLSearchParams(location.hash.slice(1)).get('token');
  history.replaceState(null, '', location.pathname);   // le jeton ne reste ni dans l'adresse ni dans l'historique
  const fail = msg => { document.getElementById('lead').textContent = msg; document.getElementById('back').hidden = false; };
  if (!token) fail('Aucun jeton reçu du bot. Relance la connexion depuis ton profil.');
  else fetch('../api/bot/link', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) })
    .then(async r => {
      if (r.status === 401) { location.replace('./'); return; }
      const d = await r.json().catch(() => ({}));
      if (r.ok) location.replace(d.next); else fail(d.error || 'Le bot a refusé la connexion.');
    })
    .catch(() => fail('Le site ne répond pas. Réessaie dans un instant.'));
</script>
</body>
</html>
