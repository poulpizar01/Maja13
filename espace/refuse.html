<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accès refusé — {{espace}} · {{nom}}</title>
<meta name="application-name" content="{{nom}}">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="espace.css">
</head>
<body class="espace-body">

<!-- Servie par le serveur (index.ts) à la place d'une page de l'espace membre quand le compte n'a pas les droits :
     la page demandée n'est jamais envoyée. -->
<main class="espace-login">
  <a class="espace-login__back" href="../">← Retour au site</a>
  <img class="espace-login__logo" src="../assets/logo.png" alt="{{nom}}" width="200" height="200">
  <p class="eyebrow">Accès refusé</p>
  <h1>Pas d'accès</h1>
  <p class="espace-login__lead">Ton compte n'a pas les droits pour ouvrir cette page. Si tu penses que c'est une erreur, vois ça avec un responsable sur Discord.</p>
  <div class="espace-login__actions">
    <a class="btn btn--accent" href="profil.html">Retour à mon profil</a>
  </div>
  <p class="espace-login__small">{{devise}}</p>
</main>
</body>
</html>
