<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>M13 OS — MAJA 13</title>
<meta name="description" content="M13 OS — le bureau interne de MAJA 13 : fiches des membres, galerie, planning. Accès réservé." />
<!-- Gadget interne : tout le contenu est généré en JS derrière un écran de
     verrouillage. Google n'indexerait qu'une page vide, on lui demande de passer. -->
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://lamaja13.fbfa.fr/os.html" />
<link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0b0e" />
<link rel="apple-touch-icon" href="assets/brand/logo-mark.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="M13" />
<script>if('serviceWorker' in navigator && location.protocol !== 'file:'){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0b0e; --panel:#14161c; --panel2:#1b1e26; --border:rgba(255,255,255,.09);
    --text:#eceef2; --muted:#9aa0b0; --dim:#8b93a5;
    --red:#9f2635; --green:#1f8a4c; --gold:#d4b26e;
  }
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text);
    background:
      radial-gradient(1200px 700px at 70% -10%, rgba(173,138,78,.12), transparent 60%),
      radial-gradient(1000px 700px at 10% 110%, rgba(159,38,53,.08), transparent 60%),
      var(--bg);
    background-size:cover; background-position:center; overflow:hidden; user-select:none;
  }
  #bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}

  /* ── BARRE DU HAUT ── */
  .topbar{
    position:fixed;top:0;left:0;right:0;height:36px;z-index:1000;
    display:flex;align-items:center;justify-content:space-between;padding:0 16px;
    background:rgba(10,11,14,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);font-size:13px;
  }
  .tb-left{display:flex;align-items:center;gap:14px}
  .start-btn{display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:6px;border:1px solid transparent}
  .start-btn:hover{border-color:var(--border)}
  .start-btn b{color:var(--gold)}
  .tb-menu{color:var(--muted);cursor:pointer;font-size:12px;text-decoration:none}
  .tb-menu:hover{color:var(--text)}
  .tb-center{position:absolute;left:50%;transform:translateX(-50%);text-align:center;line-height:1.1}
  .tb-time{font-size:12px;font-weight:600}
  .tb-date{font-size:10px;color:var(--muted);text-transform:capitalize}
  .tb-right{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}
  .tb-flag{width:22px;height:11px;border-radius:2px;overflow:hidden;display:flex;box-shadow:0 0 0 1px var(--border)}
  .tb-flag i{flex:1}.tb-flag .g{background:var(--green)}.tb-flag .w{background:#f2f2f2}.tb-flag .r{background:var(--red)}

  /* ── MENU DÉMARRER ── */
  #startmenu{position:fixed;left:12px;top:44px;z-index:1500;width:244px;background:rgba(20,22,28,.97);
    backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;padding:10px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #startmenu.open{display:block;animation:winIn .15s}
  .sm-title{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);padding:8px 8px 4px}
  .sm-item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer;font-size:13px}
  .sm-item:hover{background:rgba(255,255,255,.06)}
  .sm-item svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.7}
  .sm-item.quit{color:#ff6b6b;margin-top:8px;padding-top:12px;border-top:1px solid var(--border)}
  .sm-item.quit svg{stroke:#ff6b6b}

  /* ── MENU CONTEXTUEL ── */
  #ctx{position:fixed;z-index:1600;background:rgba(20,22,28,.98);border:1px solid var(--border);border-radius:10px;
    padding:6px;display:none;min-width:196px;box-shadow:0 16px 40px rgba(0,0,0,.6)}
  #ctx.open{display:block;animation:winIn .12s}
  .ctx-item{padding:9px 12px;border-radius:7px;font-size:13px;cursor:pointer;display:flex;gap:9px;align-items:center}
  .ctx-item:hover{background:rgba(255,255,255,.07)}

  /* ── ICÔNES BUREAU ── */
  .desktop{position:fixed;inset:0;z-index:10;pointer-events:none}
  .icon{position:absolute;pointer-events:auto;width:88px;padding:12px 6px;border-radius:12px;cursor:grab;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transition:background .15s}
  .icon:active{cursor:grabbing}
  .icon:hover{background:rgba(255,255,255,.06)}
  .icon.active{background:rgba(212,178,110,.14)}
  .icon .glyph{width:46px;height:46px;border:1px solid var(--border);border-radius:12px;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--text)}
  .icon .glyph svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7}
  .icon span{font-size:11px;color:var(--text);text-shadow:0 1px 3px #000}

  /* ── FENÊTRES ── */
  .win{position:fixed;z-index:100;min-width:260px;min-height:160px;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;animation:winIn .18s ease-out}
  @keyframes winIn{from{opacity:0;transform:scale(.98) translateY(6px)}to{opacity:1;transform:none}}
  .win-bar{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 14px;background:var(--panel2);border-bottom:1px solid var(--border);cursor:move}
  .win-title{font-size:12.5px;font-weight:600;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
  .win-title svg{width:15px;height:15px;stroke:var(--gold);fill:none;stroke-width:1.7}
  .win-btns{display:flex;gap:8px}
  .win-btns button{width:13px;height:13px;border-radius:50%;border:none;cursor:pointer}
  .b-min{background:#f0b429}.b-max{background:#3ba55d}.b-close{background:#ed4245}
  .win-body{flex:1;overflow:auto;padding:18px 20px}
  .win-body::-webkit-scrollbar{width:9px}.win-body::-webkit-scrollbar-thumb{background:#2a2e38;border-radius:6px}
  .resize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:2}
  .resize::after{content:'';position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim)}

  /* contenus */
  .breadcrumb{font-size:11px;color:var(--muted);margin-bottom:16px}
  .breadcrumb b{color:var(--gold);font-weight:600}
  .grp-title{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:18px 0 10px}
  .grp-title:first-child{margin-top:0}
  .files{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .file{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s,border-color .15s;cursor:pointer}
  .file:hover{transform:translateY(-3px);border-color:var(--gold)}
  .file .av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
  .file .fn{font-size:12px;font-weight:600;line-height:1.2}
  .file .fr{font-size:10px}
  .ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .ph-grid img{width:100%;height:110px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--border);transition:transform .2s}
  .ph-grid img:hover{transform:scale(1.03)}
  .win-body p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;text-decoration:none;padding:10px 16px;border-radius:8px;font-size:12.5px;font-weight:600;margin:6px 8px 0 0;transition:.2s}
  .btn:hover{background:#a93226}.btn.g{background:var(--panel2);border:1px solid var(--border)}
  .term{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:13px;line-height:1.7;color:#8ff0a4;background:#05070a;border-radius:8px;padding:16px;min-height:220px;white-space:pre-wrap}
  .term .c{color:var(--gold)}.term .r{color:#ff6b6b}
  .music-app{text-align:center;padding:10px 0}
  .music-disc{width:120px;height:120px;border-radius:50%;margin:0 auto 18px;background:repeating-radial-gradient(circle at center,#111 0 6px,#1a1a1a 6px 8px);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
  .music-disc.spin{animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .music-disc .hole{width:26px;height:26px;border-radius:50%;background:var(--gold)}
  .music-btn{background:var(--gold);color:#1a1206;border:none;border-radius:50%;width:52px;height:52px;font-size:20px;cursor:pointer;margin-top:6px}
  .radio-ctrl{display:flex;align-items:center;justify-content:center;gap:14px}
  .radio-ctrl button:not(.music-btn){background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
  .radio-ctrl button:not(.music-btn):hover{color:var(--text)}
  /* Mini-jeu */
  .game{text-align:center}
  .game-hud{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px}
  .game-hud b{color:var(--gold)}
  #g-canvas{background:#05070a;border:1px solid var(--border);border-radius:8px;max-width:100%;cursor:crosshair}
  /* Widget bureau (horloge + citation) */
  #widget{position:fixed;top:56px;right:16px;z-index:8;width:230px;background:rgba(20,22,28,.55);backdrop-filter:blur(8px);
    border:1px solid var(--border);border-radius:14px;padding:16px 18px;text-align:right;pointer-events:none}
  #widget .w-time{font-size:34px;font-weight:800;letter-spacing:1px;line-height:1}
  #widget .w-date{font-size:11px;color:var(--muted);text-transform:capitalize;margin-top:2px}
  #widget .w-quote{font-size:11px;color:var(--gold);font-style:italic;margin-top:12px;line-height:1.5;border-top:1px solid var(--border);padding-top:10px;transition:opacity .4s}
  @media(max-width:640px){#widget{display:none}}
  /* fiche membre */
  .profile{text-align:center}
  .profile .pav{width:78px;height:78px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff}
  .profile .pname{font-size:19px;font-weight:700}
  .profile .prank{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}
  .dossier{margin-top:18px;text-align:left;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:6px 16px;font-size:12.5px}
  .dossier .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border)}
  .dossier .row:last-child{border:none}
  .dossier .k{color:var(--muted)}.dossier .v{text-align:right}
  .stamp{margin-top:16px;text-align:center;font-size:10px;letter-spacing:2px;color:var(--red);border:1px dashed var(--red);border-radius:6px;padding:7px;text-transform:uppercase;opacity:.85}
  .lb{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;cursor:zoom-out}
  .lb.open{display:flex}.lb img{max-width:90%;max-height:90%;border-radius:6px}

  /* ── DOCK ── */
  .dock{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:8px;padding:8px 10px;
    background:rgba(20,22,28,.8);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:16px;min-height:52px;align-items:center;max-width:92vw;overflow-x:auto}
  .dock:empty{display:none}
  .dock-item{width:40px;height:40px;flex:0 0 auto;border-radius:10px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--text)}
  .dock-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
  .dock-item:hover{border-color:var(--gold)}
  .dock-item .dot{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--gold)}

  /* ── ÉCRAN DE CONNEXION ── */
  #lock{position:fixed;inset:0;z-index:6000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:radial-gradient(900px 600px at 50% 30%, rgba(212,178,110,.10), transparent 60%), #05060a;transition:opacity .5s}
  .lock-time{font-size:66px;font-weight:800;letter-spacing:2px}
  .lock-date{color:var(--muted);font-size:14px;text-transform:capitalize;margin-bottom:26px}
  .lock-crest{width:70px;height:70px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--gold);margin-bottom:10px}
  .lock-name{font-size:18px;font-weight:700;letter-spacing:1px}
  .lock-sub{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:26px}
  #enter-btn{background:var(--gold);color:#1a1206;border:none;border-radius:10px;padding:13px 30px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:transform .15s,box-shadow .2s}
  #enter-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(212,178,110,.3)}

  /* boot */
  #boot{position:fixed;inset:0;z-index:5000;background:#06070a;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .6s}
  #boot .logo{font-size:34px;font-weight:800;letter-spacing:3px}
  #boot .logo b{color:var(--gold)}
  #boot .bar{width:200px;height:3px;background:#1b1e26;border-radius:3px;overflow:hidden}
  #boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#fff,var(--red));animation:load 1.5s ease forwards}
  @keyframes load{to{width:100%}}
  /* Discord live */
  .dl-grid{display:flex;flex-wrap:wrap;gap:14px}
  .dl-m{display:flex;flex-direction:column;align-items:center;gap:5px;width:62px;text-align:center}
  .dl-av{position:relative;width:42px;height:42px}
  .dl-av img{width:42px;height:42px;border-radius:50%;background:var(--panel2)}
  .dl-av .s{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--panel)}
  .s.online{background:#3ba55d}.s.idle{background:#faa61a}.s.dnd{background:#ed4245}
  .dl-n{font-size:10px;color:var(--muted);max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Calendrier */
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700;text-transform:capitalize}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-grid .dow{font-size:10px;color:var(--dim);text-align:center;text-transform:uppercase;padding-bottom:4px}
  .cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:7px;background:var(--panel2);position:relative}
  .cal-cell.empty{background:transparent}
  .cal-cell.today{outline:2px solid var(--gold);color:var(--gold);font-weight:700}
  /* Messagerie & Dossiers */
  .list-item{display:flex;gap:12px;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--panel2);transition:border-color .15s}
  .list-item:hover{border-color:var(--gold)}
  .li-av{width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;background:var(--panel)}
  .li-from{font-size:12px;font-weight:600}.li-sub{font-size:12px;color:var(--muted)}
  .reader{white-space:pre-wrap;font-size:13px;line-height:1.7;color:var(--text)}
  .reader .rh{font-weight:700;font-size:15px;margin-bottom:4px}
  .reader .rm{color:var(--muted);font-size:11px;margin-bottom:14px}
  .back-link{color:var(--gold);cursor:pointer;font-size:12px;margin-bottom:14px;display:inline-block}
  /* Paramètres */
  .set-row{margin-bottom:20px}
  .set-row .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .sw.on{border-color:#fff}
  .wall-btns{display:flex;gap:8px;flex-wrap:wrap}
  .wall-btns button{padding:7px 12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:8px;font-size:12px;cursor:pointer}
  .wall-btns button:hover{border-color:var(--gold)}
  .toggle{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
  .toggle .sw-t{width:38px;height:20px;border-radius:20px;background:var(--dim);position:relative;transition:background .2s}
  .toggle .sw-t i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
  .toggle.on .sw-t{background:var(--green)}.toggle.on .sw-t i{left:20px}
  /* Notifications */
  #notifs{position:fixed;right:16px;bottom:72px;z-index:1800;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  .notif{background:rgba(20,22,28,.97);backdrop-filter:blur(10px);border:1px solid var(--border);border-left:3px solid var(--gold);
    border-radius:10px;padding:12px 16px;max-width:300px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:notifIn .3s ease-out}
  @keyframes notifIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
  .notif .nt{font-size:12.5px;font-weight:700;margin-bottom:3px}
  .notif .nb{font-size:12px;color:var(--muted);line-height:1.5}
  .hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:5;text-align:center}
  @media(max-width:640px){
    .tb-center{display:none}
    .win{left:10px!important;right:10px!important;width:auto!important;top:48px!important}
    .desktop{gap:2px}.icon{width:74px}
    .lock-time{font-size:48px}
  }
</style>
<link rel="stylesheet" href="maja-theme.css" />
</head>
<body>
<canvas id="bg-canvas"></canvas>

<!-- ÉCRAN DE CONNEXION -->
<div id="lock">
  <div class="lock-time" id="lock-time">--:--</div>
  <div class="lock-date" id="lock-date"></div>
  <div class="lock-crest">M</div>
  <div class="lock-name">MAJA 13</div>
  <div class="lock-sub">PRIVATE NETWORK · LOS SANTOS</div>
  <button id="enter-btn">Ouvrir le réseau privé</button>
</div>

<div id="boot"><div class="logo">M13 <b>OS</b></div><div class="bar"><i></i></div></div>

<div class="topbar">
  <div class="tb-left">
    <div class="start-btn" id="start-btn">M13 <b>OS</b></div>
    <a class="tb-menu" href="index.html">← Retour au site</a>
  </div>
  <div class="tb-center"><div class="tb-time" id="clock">--:--</div><div class="tb-date" id="date"></div></div>
  <div class="tb-right">
    <span id="tray-online">● en ligne</span>
    <div class="tb-flag"><i class="g"></i><i class="w"></i><i class="r"></i></div>
  </div>
</div>

<div id="startmenu">
  <div class="sm-title">Applications</div>
  <div id="sm-apps"></div>
  <div class="sm-item quit" onclick="location.href='index.html'">
    <svg viewBox="0 0 24 24"><path d="M12 4v8M7 7a8 8 0 1 0 10 0"/></svg> Quitter (retour au site)
  </div>
</div>

<div id="ctx">
  <div class="ctx-item" onclick="cycleWall()">🖼️ Changer le fond d'écran</div>
  <div class="ctx-item" onclick="resetWall()">↺ Fond par défaut</div>
</div>

<div class="desktop" id="desktop"></div>
<div id="widget"><div class="w-time" id="w-time">--:--</div><div class="w-date" id="w-date"></div><div class="w-quote" id="w-quote"></div></div>
<div class="dock" id="dock"></div>
<div id="notifs"></div>
<div class="hint">Double-clique une icône · glisse les fenêtres · clic droit sur le bureau pour le fond</div>

<div class="lb" id="lb"><img id="lb-img" src="" alt="" /></div>

<script src="config.js"></script>
<script>
/* ══════════════ DONNÉES ══════════════ */
// Neutralise le HTML d'un texte (base de données, Discord, nom de membre).
// Sans ça, un nom contenant une apostrophe ou un chevron casse la page.
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Variante pour un texte inséré DANS une chaîne JavaScript d'attribut onclick.
function escJs(t){ return String(t==null?'':t).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ══════════════ FENÊTRES ══════════════ */
let z=100; const openWins={}; const dock=document.getElementById('dock');

function createWindow(id,title,icon,bodyHTML,w,h,onOpen){
  if(openWins[id]){ focusWin(openWins[id]); openWins[id].style.display='flex'; return openWins[id]; }
  const win=document.createElement('div'); win.className='win';
  const W=Math.min(w,innerWidth-40), H=Math.min(h,innerHeight-120);
  win.style.width=W+'px'; win.style.height=H+'px';
  const off=Object.keys(openWins).length*26;
  win.style.left=Math.max(20,(innerWidth-W)/2+(off%120)-60)+'px';
  win.style.top=Math.max(52,(innerHeight-H)/2-20+(off%80))+'px';
  win.style.zIndex=++z;
  win.innerHTML='<div class="win-bar"><div class="win-title">'+icon+' '+title+'</div>'+
    '<div class="win-btns"><button class="b-min" title="Réduire"></button><button class="b-max" title="Agrandir"></button><button class="b-close" title="Fermer"></button></div></div>'+
    '<div class="win-body">'+bodyHTML+'</div><div class="resize"></div>';
  document.body.appendChild(win); openWins[id]=win;
  win.addEventListener('mousedown',()=>focusWin(win));
  makeDraggable(win); makeResizable(win);
  win.querySelector('.b-close').onclick=e=>{e.stopPropagation();closeWin(id);};
  win.querySelector('.b-min').onclick=e=>{e.stopPropagation();win.style.display='none';};
  win.querySelector('.b-max').onclick=e=>{e.stopPropagation();maximize(win);};
  addDock(id,title,icon);
  if(APPS[id]) markIcon(id,true);
  beep(520,0.07);
  if(onOpen) onOpen(win);
  return win;
}
function openApp(id){ const a=APPS[id]; if(!a)return; createWindow(id,a.name,a.icon,a.body(),a.w,a.h,a.onOpen); }
function openMember(name,rank,color){
  let s=0; for(const c of name) s=(s*31+c.charCodeAt(0))%9973;
  const mat='MN-'+(1000+s%9000);
  const html='<div class="profile"><div class="pav" style="background:'+color+(color==='#d4b26e'?';color:#1a1206':'')+'">'+ini(name)+'</div>'+
    '<div class="pname">'+name+'</div><div class="prank" style="color:'+color+'">'+rank+'</div>'+
    '<div class="dossier">'+
      '<div class="row"><span class="k">Matricule</span><span class="v">'+mat+'</span></div>'+
      '<div class="row"><span class="k">Grade</span><span class="v" style="color:'+color+'">'+rank+'</span></div>'+
      '<div class="row"><span class="k">Quartier</span><span class="v">Los Santos</span></div>'+
      '<div class="row"><span class="k">Statut</span><span class="v" style="color:#3ba55d">Actif</span></div>'+
      '<div class="row"><span class="k">Rôle</span><span class="v" style="max-width:180px">'+(ROLE_DESC[rank]||'Membre de la famille.')+'</span></div>'+
    '</div><div class="stamp">MAJA 13 — Confidentiel</div></div>';
  createWindow('m-'+name.replace(/\s+/g,''), name, SVG.user, html, 380, 430);
}
function closeWin(id){
  const w=openWins[id];
  if(w){ if(w._cleanup) w._cleanup(); w.remove(); }
  delete openWins[id];
  const d=document.getElementById('dock-'+id); if(d)d.remove();
  if(APPS[id])markIcon(id,false);
}
function focusWin(win){ win.style.zIndex=++z; win.style.display='flex'; }
function maximize(win){
  if(win.dataset.max){ win.style.cssText=win.dataset.prev; win.dataset.max=''; }
  else{ win.dataset.prev=win.style.cssText; win.dataset.max='1';
    win.style.left='14px';win.style.top='46px';win.style.width=(innerWidth-28)+'px';win.style.height=(innerHeight-70)+'px'; }
}
function addDock(id,name,icon){
  if(document.getElementById('dock-'+id)) return;
  const el=document.createElement('div'); el.className='dock-item'; el.id='dock-'+id; el.title=name;
  el.innerHTML=icon+'<span class="dot"></span>';
  el.onclick=()=>{ const w=openWins[id]; if(w) focusWin(w); };
  dock.appendChild(el);
}
function markIcon(id,on){ const ic=document.getElementById('ic-'+id); if(ic) ic.classList.toggle('active',on); }
// Les écouteurs posés sur window sont mémorisés dans win._cleanup pour être
// retirés à la fermeture de la fenêtre (sinon ils s'accumulent indéfiniment).
function suivreFenetre(win, fn){
  (win._suivis = win._suivis || []).push(fn);
  if(!win._cleanup){
    win._cleanup = () => {
      win._suivis.forEach(([ev,h]) => window.removeEventListener(ev,h));
      win._suivis.length = 0;
    };
  }
}
function makeDraggable(win){
  const bar=win.querySelector('.win-bar'); let sx,sy,ox,oy,drag=false;
  bar.addEventListener('mousedown',e=>{ if(e.target.tagName==='BUTTON')return; drag=true; sx=e.clientX;sy=e.clientY;ox=win.offsetLeft;oy=win.offsetTop;document.body.style.cursor='move'; });
  const move=e=>{ if(!drag)return; win.style.left=Math.max(0,Math.min(innerWidth-60,ox+e.clientX-sx))+'px'; win.style.top=Math.max(40,Math.min(innerHeight-40,oy+e.clientY-sy))+'px'; };
  const up=()=>{ drag=false; document.body.style.cursor=''; };
  window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  suivreFenetre(win,['mousemove',move]); suivreFenetre(win,['mouseup',up]);
}
function makeResizable(win){
  const h=win.querySelector('.resize'); if(!h)return; let rs=false,sx,sy,sw,sh;
  h.addEventListener('mousedown',e=>{ e.stopPropagation();rs=true;sx=e.clientX;sy=e.clientY;sw=win.offsetWidth;sh=win.offsetHeight;document.body.style.cursor='nwse-resize'; });
  const move=e=>{ if(!rs)return; win.style.width=Math.max(260,sw+e.clientX-sx)+'px'; win.style.height=Math.max(160,sh+e.clientY-sy)+'px'; };
  const up=()=>{ rs=false;document.body.style.cursor=''; };
  window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  suivreFenetre(win,['mousemove',move]); suivreFenetre(win,['mouseup',up]);
}

/* ══════════════ ICÔNES BUREAU + MENU DÉMARRER ══════════════ */
const desktop=document.getElementById('desktop');
const ICONPOS = JSON.parse(localStorage.getItem('maja-icons')||'{}');
let iconN=0;
Object.keys(APPS).forEach(id=>{
  const app=APPS[id];
  if(app.desk===false) return;   // apps réservées au menu démarrer
  const ic=document.createElement('div'); ic.className='icon'; ic.id='ic-'+id;
  ic.innerHTML='<div class="glyph">'+app.icon+'</div><span>'+app.name+'</span>';
  const pos=ICONPOS[id]||{x:14,y:52+iconN*84}; iconN++;
  ic.style.left=pos.x+'px'; ic.style.top=pos.y+'px';
  let sx,sy,ox,oy,moved=false,down=false;
  ic.addEventListener('mousedown',e=>{ down=true;moved=false;sx=e.clientX;sy=e.clientY;ox=ic.offsetLeft;oy=ic.offsetTop; });
  window.addEventListener('mousemove',e=>{ if(!down)return;
    if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>5) moved=true;
    if(moved){ ic.style.left=Math.max(0,Math.min(innerWidth-92,ox+e.clientX-sx))+'px'; ic.style.top=Math.max(44,Math.min(innerHeight-96,oy+e.clientY-sy))+'px'; } });
  window.addEventListener('mouseup',()=>{ if(!down)return; down=false;
    if(moved){ ICONPOS[id]={x:ic.offsetLeft,y:ic.offsetTop}; localStorage.setItem('maja-icons',JSON.stringify(ICONPOS)); }
    else openApp(id); });
  desktop.appendChild(ic);
});

  '<div class="sm-item" onclick="openApp(\''+id+'\');closeMenus()">'+APPS[id].icon+' '+APPS[id].name+'</div>').join('');

/* ══════════════ MENU CONTEXTUEL + FOND D'ÉCRAN ══════════════ */
const ctx=document.getElementById('ctx');
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('.win')||e.target.closest('.topbar')||e.target.closest('.dock')||e.target.closest('#startmenu')) return;
  e.preventDefault(); ctx.style.left=Math.min(e.clientX,innerWidth-206)+'px'; ctx.style.top=Math.min(e.clientY,innerHeight-110)+'px'; ctx.classList.add('open');

let wallIdx=parseInt(localStorage.getItem('maja-wall')); if(isNaN(wallIdx))wallIdx=-1;
function applyWall(i){
  if(i<0){ document.body.style.backgroundImage=''; }
  else{ document.body.style.backgroundImage='linear-gradient(rgba(6,7,10,.74),rgba(6,7,10,.82)), url("'+WALLS[i%WALLS.length]+'")'; }
}
function cycleWall(){ wallIdx=(wallIdx+1)%WALLS.length; localStorage.setItem('maja-wall',wallIdx); applyWall(wallIdx); }
function resetWall(){ wallIdx=-1; localStorage.removeItem('maja-wall'); applyWall(-1); }

/* ── RADIO (multi-titres) ── */
let radio, rIdx=0;
function radioRender(){
  const tt=document.getElementById('rtitle'), rc=document.getElementById('rcount'), btn=document.getElementById('mbtn'), disc=document.getElementById('disc');
  if(!tt) return;
  tt.textContent=TRACKS[rIdx].title;
  rc.textContent=TRACKS.length>1 ? ('Piste '+(rIdx+1)+' / '+TRACKS.length) : 'Radio M13';
  const playing = radio && !radio.paused;
  if(btn) btn.textContent = playing ? '❚❚' : '▶';
  if(disc) disc.classList.toggle('spin', !!playing);
}
function radioPlay(){
  if (!TRACKS[rIdx].src) { notify('Radio', 'Ajoutez un fichier audio et son chemin dans os.html.'); return; }
  if(!radio){ radio=new Audio(); radio.volume=.4; radio.addEventListener('ended',radioNext); radio.addEventListener('play',radioRender); radio.addEventListener('pause',radioRender); }
  radio.src=TRACKS[rIdx].src; radio.play().catch(()=>{}); radioRender();
}
function radioToggle(){ if(!radio){ radioPlay(); return; } if(radio.paused) radio.play().catch(()=>{}); else radio.pause(); radioRender(); }
function radioNext(){ rIdx=(rIdx+1)%TRACKS.length; radioPlay(); }
function radioPrev(){ rIdx=(rIdx-1+TRACKS.length)%TRACKS.length; radioPlay(); }

/* ── MINI-JEU : tir sur cible ── */
let gWin, gActive=false, gScore=0, gTime=30, gTargets=[], gRaf, gTimerI, gSpawnI;
function gameInit(win){ gWin=win; const c=win.querySelector('#g-canvas'); if(!c)return; const x=c.getContext('2d');
  x.fillStyle='#05070a'; x.fillRect(0,0,c.width,c.height); x.fillStyle='#5b6272'; x.font='14px system-ui'; x.textAlign='center';
  x.fillText('Clique « Commencer »', c.width/2, c.height/2); }
function gameStart(){
  const win=gWin; if(!win)return; const c=win.querySelector('#g-canvas'); if(!c)return; const x=c.getContext('2d');
  gScore=0; gTime=30; gActive=true; gTargets=[];
  win.querySelector('#g-score').textContent='0'; win.querySelector('#g-time').textContent='30';
  const sb=win.querySelector('#g-start'); if(sb) sb.style.display='none';
  clearInterval(gTimerI); clearInterval(gSpawnI); cancelAnimationFrame(gRaf);
  gSpawnI=setInterval(()=>{ if(gActive && gTargets.length<4) gTargets.push({x:22+Math.random()*(c.width-44),y:22+Math.random()*(c.height-44),r:15+Math.random()*10}); }, 650);
  gTimerI=setInterval(()=>{ gTime--; const te=win.querySelector('#g-time'); if(te)te.textContent=gTime; if(gTime<=0) gameEnd(); }, 1000);
  c.onclick=(e)=>{ if(!gActive)return; const r=c.getBoundingClientRect(); const mx=(e.clientX-r.left)*(c.width/r.width), my=(e.clientY-r.top)*(c.height/r.height);
    for(let i=gTargets.length-1;i>=0;i--){ const t=gTargets[i]; if(Math.hypot(mx-t.x,my-t.y)<t.r){ gTargets.splice(i,1); gScore++; const se=win.querySelector('#g-score'); if(se)se.textContent=gScore; beep(760,0.05); break; } } };
  (function draw(){ if(!gActive || !document.body.contains(c)) return;
    x.fillStyle='#05070a'; x.fillRect(0,0,c.width,c.height);
    gTargets.forEach(t=>{ x.beginPath();x.arc(t.x,t.y,t.r,0,7);x.fillStyle='#c0392b';x.fill();
      x.beginPath();x.arc(t.x,t.y,t.r*0.6,0,7);x.fillStyle='#f2f2f2';x.fill();
      x.beginPath();x.arc(t.x,t.y,t.r*0.25,0,7);x.fillStyle='#c0392b';x.fill(); });
    gRaf=requestAnimationFrame(draw); })();
}
function gameEnd(){ gActive=false; clearInterval(gTimerI); clearInterval(gSpawnI); cancelAnimationFrame(gRaf);
  const win=gWin; if(!win)return; const c=win.querySelector('#g-canvas'); if(c){ const x=c.getContext('2d');
    x.fillStyle='rgba(5,7,10,.86)'; x.fillRect(0,0,c.width,c.height);
    x.fillStyle='#d4b26e'; x.font='bold 22px system-ui'; x.textAlign='center'; x.fillText('Score : '+gScore, c.width/2, c.height/2-6);
    x.fillStyle='#9aa0b0'; x.font='13px system-ui'; x.fillText('Rejoue quand tu veux', c.width/2, c.height/2+20); }
  const sb=win.querySelector('#g-start'); if(sb){ sb.style.display=''; sb.textContent='Rejouer'; }
  notify('Tir sur cible','Partie terminée — score : '+gScore);
}

/* ══════════════ FOND RÉSEAU ══════════════ */
(function net(){
  const c=document.getElementById('bg-canvas'),x=c.getContext('2d');let W,H,ps=[];
  const REDUIT = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 35 particules au lieu de 70 : le coût des liaisons est quadratique,
  // diviser le nombre par 2 divise le travail par image par 4.
  function rs(){W=c.width=innerWidth;H=c.height=innerHeight;ps=[];const n=Math.min(35,Math.round(W*H/44000));
    for(let i=0;i<n;i++)ps.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25});}
  rs();addEventListener('resize',rs);
  function loop(){x.clearRect(0,0,W,H);
    for(let i=0;i<ps.length;i++){const a=ps[i];a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1;
      for(let j=i+1;j<ps.length;j++){const b=ps[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
        if(d<120){x.strokeStyle='rgba(180,180,190,'+(.14*(1-d/120))+')';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}}
      x.fillStyle='rgba(200,200,210,.5)';x.beginPath();x.arc(a.x,a.y,1,0,7);x.fill();}
    if(!REDUIT && !document.hidden) requestAnimationFrame(loop);}
  loop();
  // L'animation s'arrête quand l'onglet passe en arrière-plan, et repart au retour.
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !REDUIT) requestAnimationFrame(loop); });
})();

/* ══════════════ PARAMÈTRES / SONS / NOTIFICATIONS ══════════════ */
const settings = Object.assign({sound:true,notifs:true,accent:'#d4b26e'}, JSON.parse(localStorage.getItem('maja-settings')||'{}'));
function saveSettings(){ localStorage.setItem('maja-settings',JSON.stringify(settings)); }
function applyAccent(){ document.documentElement.style.setProperty('--gold', settings.accent); }
applyAccent();
let actx;
function beep(freq,dur,type){
  if(!settings.sound) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine'; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    g.gain.value=0.04; o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function notify(title, body){
  if(!settings.notifs) return;
  const c=document.getElementById('notifs');
  const n=document.createElement('div'); n.className='notif';
  n.innerHTML='<div class="nt">'+esc(title)+'</div><div class="nb">'+esc(body)+'</div>';
  c.appendChild(n); beep(660,0.09);
  setTimeout(()=>{ n.style.transition='opacity .4s'; n.style.opacity='0'; setTimeout(()=>n.remove(),400); }, 5200);
}

/* ══════════════ DISCORD EN DIRECT ══════════════ */
function looksName(u){ if(!u)return false; const p=u.trim().split(/\s+/); if(p.length<2)return false; if(/\bbot\b/i.test(u))return false; return p.every(x=>/^[A-Za-zÀ-ÿ'’.\-]+$/.test(x)); }
function loadDiscord(win){
  const grid=win.querySelector('#dl-grid'), cnt=win.querySelector('#dlc');
  if(!DISCORD_GUILD){ grid.innerHTML='<span style="color:var(--dim);font-size:12px">Configurez l’identifiant Discord dans config.js.</span>'; return; }
  fetch('https://discord.com/api/guilds/'+DISCORD_GUILD+'/widget.json?_='+Date.now(),{cache:'no-store'})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{
      const ms=(d.members||[]).filter(m=>looksName(m.username));
      if(cnt) cnt.textContent='· '+ms.length;
      if(!ms.length){ grid.innerHTML='<span style="color:var(--dim);font-size:12px">Personne en ligne.</span>'; return; }
      grid.innerHTML=ms.map(m=>{ const st=['online','idle','dnd'].includes(m.status)?m.status:'online';
        return '<div class="dl-m"><div class="dl-av"><img src="'+esc(m.avatar_url||'')+'" alt="" loading="lazy" decoding="async"><span class="s '+st+'"></span></div><div class="dl-n">'+esc(m.username)+'</div></div>'; }).join('');
    }).catch(()=>{ grid.innerHTML='<span style="color:var(--dim);font-size:12px">Widget Discord indisponible.</span>'; });
}

function calendarHTML(){

  const start=(new Date(y,mo,1).getDay()+6)%7; const days=new Date(y,mo+1,0).getDate();
  const moName=now.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  let cells=''; ['Lu','Ma','Me','Je','Ve','Sa','Di'].forEach(d=>cells+='<div class="dow">'+d+'</div>');
  for(let i=0;i<start;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){ let cls='cal-cell'; if(d===today)cls+=' today'; cells+='<div class="'+cls+'">'+d+'</div>'; }
  return '<div class="cal-head"><span>'+moName+'</span></div><div class="cal-grid">'+cells+'</div>';
}
