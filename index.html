<script>
  // Déjà entré dans cette session : on passe à l'accueil. La page devient un simple « passage » (noir :
  // le fond des transitions de styles.css), pour qu'en venant de La Casa les deux transitions s'enchaînent sans rupture.
  let passage = false;
  try { passage = !!sessionStorage.getItem('maja13-entered') && !location.hash; } catch {}
  if (passage) {
    document.documentElement.classList.add('passage');
    // on laisse la page quittée finir de s'effacer, puis l'accueil descend par-dessus le passage
    let parti = false;
    const suite = () => { if (!parti) { parti = true; try { sessionStorage.setItem('maja13-passage', '1'); } catch {} location.replace('accueil.html'); } };
    addEventListener('pagereveal', e => setTimeout(suite, e.viewTransition ? 220 : 0));
    setTimeout(suite, 1500);   // filet : navigateur sans pagereveal
  }
  // transitions animées seulement vers La Casa (et depuis le passage) : l'entrée vers l'accueil a sa propre animation
  addEventListener('pageswap', e => {
    try { if (e.viewTransition && !passage && !new URL(e.activation.entry.url).pathname.startsWith('/espace/')) e.viewTransition.skipTransition(); } catch {}
  });
</script>
<link rel="prefetch" href="accueil.html">
<style>
  html.passage{background:var(--vt-fond)}
  html.passage body{visibility:hidden}
  html,body{height:100%;overflow:hidden}
  .entry{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;
    background:radial-gradient(ellipse at 50% 42%,#1c150d 0%,#0b0909 55%,#050406 100%)}
  .entry__fx{position:absolute;inset:0;width:100%;height:100%}
  .entry__inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:0}
  .entry__logo{width:min(420px,70vw);height:auto;filter:drop-shadow(0 0 60px rgba(201,164,92,.35)) drop-shadow(0 20px 40px rgba(0,0,0,.8));animation:entryFloat 7s ease-in-out infinite,entryIn 1.6s cubic-bezier(.2,.8,.2,1) both}
  .entry__eyebrow{margin:34px 0 10px;animation:entryIn 1.6s .35s both}
  .entry__title{font-family:var(--display);font-size:clamp(46px,8vw,96px);line-height:.95;letter-spacing:.05em;color:var(--ink);text-shadow:0 0 40px rgba(201,164,92,.35),0 4px 0 #2a1d0c;animation:entryIn 1.6s .5s both}
  .entry__title span{background:linear-gradient(180deg,#f7e6b6,#c9a45c 55%,#8a6a34);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 #2a1d0c)}
  .entry__motto{font-family:var(--serif);font-size:clamp(11px,1.5vw,14px);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin:18px 0 38px;animation:entryIn 1.6s .7s both}
  .entry__motto i{font-style:normal;opacity:.5;margin:0 8px}
  .entry__btn{animation:entryIn 1.6s .9s both;font-size:13px;padding:18px 44px;letter-spacing:.34em}
  .entry__small{position:absolute;bottom:22px;left:0;right:0;z-index:2;font-family:var(--serif);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold2);animation:entryIn 1.6s 1.2s both}
  .entry__small a{color:var(--gold2)}.entry__small a:hover{color:var(--gold)}
  .entry.is-leaving{animation:entryOut .7s ease forwards}
  @keyframes entryIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes entryFloat{50%{transform:translateY(-12px)}}
  @keyframes entryOut{to{opacity:0;transform:scale(1.04)}}
  @media (max-height:860px){.entry__logo{width:min(300px,50vw)}.entry__eyebrow{margin-top:22px}.entry__motto{margin-bottom:26px}}
  @media (max-height:700px){.entry__logo{width:min(220px,40vw)}.entry__title{font-size:clamp(40px,7vw,64px)}}
  @media (prefers-reduced-motion:reduce){.entry__logo,.entry__eyebrow,.entry__title,.entry__motto,.entry__btn,.entry__small{animation:none}}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main class="entry" id="entry">
  <canvas class="entry__fx" id="fx" aria-hidden="true"></canvas>
  <div class="entry__inner">
    <img class="entry__logo" fetchpriority="high" src="assets/logo.webp" alt="Blason de La Maja 13" width="420" height="420">
    <p class="eyebrow entry__eyebrow">Los Santos · Flashback FA</p>
    <h1 class="entry__title">La <span>Maja</span> 13</h1>
    <p class="entry__motto">Lealtad <i>·</i> Respeto <i>·</i> La familia es sagrada</p>
    <a class="btn btn--gold entry__btn" href="accueil.html" id="enter">Entrer</a>
  </div>
  <p class="entry__small"><a href="espace/">Espace membres</a> · Roleplay sur Flashback FA</p>
</main>
<script>
  document.getElementById('enter').addEventListener('click', e => {
    e.preventDefault(); try { sessionStorage.setItem('maja13-entered', '1'); } catch {}
    document.getElementById('entry').classList.add('is-leaving');
    setTimeout(() => location.href = 'accueil.html', 650);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('enter').click(); });

  // poussière d'or (même esprit que La Casa)
  (function () {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const cv = document.getElementById('fx'), ctx = cv.getContext('2d'); let W, H, P = [];
    const mouse = { x: -1e4, y: -1e4 }; addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
    const mk = init => { const z = Math.random(); return { x: Math.random() * W, y: init ? Math.random() * H : H + 10, z, r: .6 + z * 2.4, v: (.12 + z * .5) * (reduce ? .3 : 1), sw: Math.random() * 6.28, a: .25 + z * .6, hue: 38 + Math.random() * 12 }; };
    function resize() { const dpr = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); P = []; for (let i = 0; i < Math.round(W * H / 8000); i++) P.push(mk(true)); }
    addEventListener('resize', resize); resize();
    let last = 0;
    (function draw(now) {
      requestAnimationFrame(draw); const t = now / 1000, dt = Math.min((now - last) / 1000, .05); last = now;
      ctx.clearRect(0, 0, W, H);
      const g = ctx.createRadialGradient(W / 2, H * .42, 0, W / 2, H * .42, Math.max(W, H) * .5);
      g.addColorStop(0, `rgba(201,164,92,${.07 + Math.sin(t * .6) * .02})`); g.addColorStop(.5, 'rgba(120,90,40,.03)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      for (const p of P) {
        p.y -= p.v * 60 * dt; p.x += Math.sin(t * .7 + p.sw) * .15 * p.z;
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy; if (d2 < 25600 && d2 > 1) { const d = Math.sqrt(d2), f = (1 - d / 160) * .9; p.x += dx / d * f; p.y += dy / d * f; }
        if (p.y < -10) Object.assign(p, mk(false));
        const tw = .6 + .4 * Math.sin(t * 2 + p.sw * 3);
        ctx.fillStyle = `hsla(${p.hue},70%,${55 + p.z * 25}%,${p.a * tw})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill();
        if (p.z > .75) { ctx.fillStyle = `hsla(${p.hue},80%,70%,${.06 * tw})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 5, 0, 6.28); ctx.fill(); }
      }
      ctx.globalCompositeOperation = 'source-over';
    })(0);
  })();
</script>
</body>
