<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Salon — La Casa · La Maja 13</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="casa.css">
<script src="casa.js"></script>
</head>
<body class="casa-body casa-body--chat" data-fx="soft">
<div class="grain" aria-hidden="true"></div>
<script src="casa-bg.js" defer></script>

<header class="nav is-scrolled">
  <a class="nav__brand" href="../index.html#entrada"><img src="../assets/logo-nav.webp" alt="" width="40" height="40"><span>La Maja <em>13</em></span></a>
  <nav class="nav__links casa-nav">
    <a href="perfil.html">Mon profil</a>
    <a href="familia.html">La Famille</a>
    <a href="classement.html">Classement</a>
    <a href="chat.html" class="is-active" id="chatLink">Le Salon<span class="nav__badge" id="chatBadge" hidden></span></a>
    <a href="galerie.html">Galerie</a>
    <div class="nav__group" id="gestion" hidden>
      <button class="nav__group-btn" type="button" aria-expanded="false">Gestion <i>▾</i></button>
      <div class="nav__menu">
        <a href="admin.html">Administration</a>
        <a href="tableau.html">Tableau de bord</a>
        <a href="stats.html">Statistiques</a>
        <a href="taxes.html">Taxes</a>
        <a href="armurerie.html">Armurerie</a>
        <a href="organigramme.html" id="orgLink" hidden>Hiérarchie</a>
      </div>
    </div>
    <a href="../accueil.html">Le site</a>
    <button class="nav__cta casa-logout" id="logout">Déconnexion</button>
  </nav>
</header>

<main class="chat">
  <aside class="chat__side">
    <h2 class="chat__title">Le Salon</h2>
    <p class="chat__sub">La discussion de la familia</p>
    <h3 class="chat__side-title">En ligne <span class="badge badge--gold" id="onlineCount">0</span></h3>
    <ul class="chat__online" id="online"></ul>
    <p class="chat__rules">Lealtad · Respeto. Ce qui se dit ici reste dans la familia.</p>
  </aside>

  <section class="chat__main">
    <div class="chat__status" id="status">Connexion…</div>
    <div class="chat__log" id="log">
      <button class="chat__more" id="more" hidden>Messages plus anciens</button>
    </div>
    <form class="chat__form" id="form" autocomplete="off">
      <textarea id="input" rows="1" maxlength="1000" placeholder="Écris à la familia… (Entrée pour envoyer, Maj+Entrée pour une nouvelle ligne)" required></textarea>
      <button class="btn btn--gold" type="submit">Envoyer</button>
    </form>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/@([^\s@<][^@<]{0,40}?)(?=\s|$|[.,;:!?])/g, (m0, n) => mentionable.has(n.toLowerCase()) ? `<span class="mention">@${n}</span>` : m0);
  let mentionable = new Set(), members = [];
  const isMentioned = c => { const re = new RegExp('@(' + [me.displayName, me.username].filter(Boolean).map(s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![\\w-])', 'i'); return re.test(c); };
  const time = d => new Date(d).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const day = d => new Date(d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  let me, oldest = null, lastDay = null, lastAuthor = null;
  const log = $('log');

  const api = (url, opt = {}) => fetch(url, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opt })
    .then(async r => { if (r.status === 401) { location.replace('./'); throw 0; } if (r.status === 403) { location.replace('espera.html'); throw 0; } const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; });

  const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const scrollDown = () => { log.scrollTop = log.scrollHeight; };

  function msgHtml(m, grouped) {
    const mine = m.author.id === me.id;
    const canDel = mine || me.isAdmin;
    return `<article class="msg ${mine ? 'msg--mine' : ''} ${grouped ? 'msg--grouped' : ''} ${!mine && isMentioned(m.content) ? 'msg--mention' : ''}" data-id="${m.id}">
      <img class="msg__avatar" src="${m.author.avatarUrl || '../assets/favicon.png'}" alt="">
      <div class="msg__body">
        <header class="msg__head"><b class="msg__name">${esc(m.author.displayName)}</b><span class="msg__rank" data-featured="${m.author.rankFeatured}">${esc(m.author.rankLabel || '')}</span><time>${time(m.createdAt)}</time>${canDel ? `<button class="msg__del" data-del="${m.id}" title="Supprimer">✕</button>` : ''}</header>
        <p class="msg__text">${linkify(m.content)}</p>
      </div>
    </article>`;
  }
  function dayHtml(d) { return `<div class="chat__day"><span>${day(d)}</span></div>`; }

  function append(m) {
    const stick = atBottom();
    const d = new Date(m.createdAt).toDateString();
    let html = '';
    if (d !== lastDay) { html += dayHtml(m.createdAt); lastDay = d; lastAuthor = null; }
    html += msgHtml(m, lastAuthor === m.author.id);
    lastAuthor = m.author.id;
    log.insertAdjacentHTML('beforeend', html);
    if (stick || m.author.id === me.id) scrollDown();
    markRead(m.id);
  }
  let lastMarked = 0, markTimer = null;
  function markRead(id) {
    if (document.hidden || id <= lastMarked) return;
    lastMarked = id; clearTimeout(markTimer);
    markTimer = setTimeout(() => fetch('../api/chat/read', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lastId: id }) }).catch(() => {}), 400);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { const last = log.querySelector('.msg:last-of-type'); if (last) { lastMarked = 0; markRead(Number(last.dataset.id)); } } });
  function prepend(list) {
    if (!list.length) { $('more').hidden = true; return; }
    const prevHeight = log.scrollHeight;
    let html = '', prevDay = null, prevAuthor = null;
    for (const m of list) {
      const d = new Date(m.createdAt).toDateString();
      if (d !== prevDay) { html += dayHtml(m.createdAt); prevDay = d; prevAuthor = null; }
      html += msgHtml(m, prevAuthor === m.author.id); prevAuthor = m.author.id;
    }
    $('more').insertAdjacentHTML('afterend', html);
    oldest = list[0].id;
    $('more').hidden = list.length < 60;
    log.scrollTop += log.scrollHeight - prevHeight;
  }

  function renderOnline(list) {
    $('onlineCount').textContent = list.length;
    $('online').innerHTML = list.map(u => `<li><img src="${u.avatarUrl || '../assets/favicon.png'}" alt=""><span>${esc(u.displayName)}</span><i data-featured="${u.rankFeatured}">${esc(u.rankLabel || '')}</i></li>`).join('');
  }

  let es;
  function connect() {
    es = new EventSource('../api/chat/stream');
    es.onopen = () => { $('status').textContent = ''; $('status').hidden = true; };
    es.onerror = () => { $('status').hidden = false; $('status').textContent = 'Connexion perdue, nouvelle tentative…'; };
    es.addEventListener('message', e => append(JSON.parse(e.data)));
    es.addEventListener('presence', e => renderOnline(JSON.parse(e.data)));
    es.addEventListener('delete', e => { const { id } = JSON.parse(e.data); const el = log.querySelector(`[data-id="${id}"]`); if (el) el.remove(); });
  }

  async function init() {
    me = await api('../api/me');
    if (me.status !== 'approved') { location.replace('espera.html'); return; }
    casaNav(me);
    members = await api('../api/chat/mentions').catch(() => []);
    mentionable = new Set(members.flatMap(u => [u.name.toLowerCase(), u.username.toLowerCase()]));
    const first = await api('../api/chat/messages');
    for (const m of first) append(m);
    if (first.length) { oldest = first[0].id; $('more').hidden = first.length < 60; }
    scrollDown();
    connect();
    $('input').focus();
  }

  async function send() {
    const content = $('input').value.trim();
    if (!content) return;
    $('input').value = ''; $('input').style.height = '';
    try { await api('../api/chat/messages', { method: 'POST', body: JSON.stringify({ content }) }); }
    catch (e) { $('status').hidden = false; $('status').textContent = "Message non envoyé : " + e.message; }
  }
  $('form').addEventListener('submit', e => { e.preventDefault(); send(); });
  $('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  $('input').addEventListener('input', e => { e.target.style.height = ''; e.target.style.height = Math.min(e.target.scrollHeight, 160) + 'px'; autocomplete(); });
  // autocomplétion @mention
  const ac = document.createElement('div'); ac.className = 'chat__ac'; ac.hidden = true; $('form').appendChild(ac);
  let acItems = [], acIdx = 0, acStart = -1;
  function autocomplete() {
    const el = $('input'), v = el.value.slice(0, el.selectionStart);
    const m = v.match(/(?:^|\s)@([^\s@]{0,30})$/);
    if (!m) { ac.hidden = true; return; }
    acStart = v.length - m[1].length - 1;
    const q = m[1].toLowerCase();
    acItems = members.filter(u => u.name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q)).slice(0, 8);
    if (!acItems.length) { ac.hidden = true; return; }
    acIdx = 0;
    ac.innerHTML = acItems.map((u, i) => `<button type="button" data-i="${i}" class="${i === 0 ? 'is-on' : ''}"><span>${esc(u.name)}</span><small>@${esc(u.username)}</small></button>`).join('');
    ac.hidden = false;
  }
  function pickMention(i) {
    const el = $('input'), u = acItems[i]; if (!u) return;
    const after = el.value.slice(el.selectionStart);
    el.value = el.value.slice(0, acStart) + '@' + u.name + ' ' + after;
    const pos = acStart + u.name.length + 2; el.setSelectionRange(pos, pos); el.focus(); ac.hidden = true;
  }
  ac.addEventListener('mousedown', e => { e.preventDefault(); const b = e.target.closest('[data-i]'); if (b) pickMention(Number(b.dataset.i)); });
  $('input').addEventListener('keydown', e => {
    if (ac.hidden) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); acIdx = (acIdx + (e.key === 'ArrowDown' ? 1 : -1) + acItems.length) % acItems.length; [...ac.children].forEach((b, i) => b.classList.toggle('is-on', i === acIdx)); }
    else if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); e.stopImmediatePropagation(); pickMention(acIdx); }
    else if (e.key === 'Escape') ac.hidden = true;
  }, true);
  $('more').addEventListener('click', async () => { const list = await api('../api/chat/messages?before=' + oldest); prepend(list); });
  log.addEventListener('click', async e => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    if (await casaConfirm('Ce message sera retiré du Salon pour tout le monde.', { title: 'Supprimer ce message ?', ok: 'Supprimer', danger: true }))
      await api('../api/chat/messages/' + b.dataset.del, { method: 'DELETE' }).catch(() => {});
  });
  $('logout').addEventListener('click', async () => { es && es.close(); await fetch('../auth/logout', { method: 'POST', credentials: 'same-origin' }); location.href = './'; });
  init().catch(() => {});
</script>
</body>
</html>
